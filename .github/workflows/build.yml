name: Build Launcher

on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: JanksyLauncher.exe
            asset_name: JanksyLauncher-Windows.exe
          - os: ubuntu-latest
            artifact_name: JanksyLauncher
            asset_name: JanksyLauncher-Linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install minecraft-launcher-lib pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --onefile --noconsole --name "JanksyLauncher" janksy.py

      - name: Rename build artifact
        shell: bash
        run: |
          mv dist/${{ matrix.artifact_name }} dist/${{ matrix.asset_name }}

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}